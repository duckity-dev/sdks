[package]
name = "duckity_wasm"
version = "0.1.0"
authors = ["Rafael Bradley <rafabradleyrb@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
duckity-core = { version = "0.1.0", path = "../duckity_core" }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
