<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duckity @duckity/js Example</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 300px;
      }

      input, button {
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>@duckity/js Example</h1>

    <form id="form">
      <input
        type="email"
        name="email"
        id="input-email"
        placeholder="Email"
        required
      />
      <input
        type="password"
        name="password"
        id="input-password"
        placeholder="Password"
        required
      />
      <button type="submit">Submit</button>
    </form>

      form.onsubmit = async (e) => {
        e.preventDefault();

        const email = inputEmail.value;

      };
    </script>
  </body>
</html>
